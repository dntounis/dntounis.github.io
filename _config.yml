# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap



# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# NOTE: do not add `_includes` or `_data` to `include:`. Doing so copies them
# verbatim into the build, publishing raw YAML and template partials at
# /_data/*.yml and /_includes/*.html. Liquid reads both regardless.

# Maintenance tooling: runs locally, never served.
exclude:
  - scripts/
  - Gemfile
  - Gemfile.lock
  - README.md

lsi: false
safe: true
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge




# Publications are rendered from _data/publications.yml by publications.md.
# There is no BibTeX pipeline: jekyll-scholar is not whitelisted by GitHub
# Pages, and `safe: true` disables _plugins/ regardless.

# Collections for projects
collections:
  projects:
    output: false
    permalink: /projects/:path/
    permalink: /projects/:title/


# Default layouts
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project



# Navigation
header_pages:
  - projects.md
  - publications.md
  - talks.md
  - teaching.md
  - cv.md
  - contact.md

# Academic Settings
academic_links:
  google_scholar: true
  research_gate: true
  orcid: true    

# Current CV only. Superseded versions live outside the repo in ../cv_archive/
# so they are neither published nor indexed.
cv_pdf: /assets/files/DN_CV_3March2026.pdf


google_analytics: G-5LN3L9EYD6
